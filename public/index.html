<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1e1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crew">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Claude Crew</title>
<style>
  :root {
    --bg: #faf9f5; --panel: #ffffff; --panel-2: #f0eee6; --text: #1f1e1d; --muted: #6b6a65;
    --border: #e3e0d6; --accent: #c96442; --accent-text: #fff; --you: #c96442; --you-text: #fff;
    --ok: #4a8a5c; --warn: #b7822b; --err: #b3412f; --code: #f3f1ea;
    --add-bg: #e6f4ea; --add-fg: #1e6b34; --del-bg: #fbe9e7; --del-fg: #a3281b; --hunk: #3a6ea5;
    --scroll-thumb: #cfcbbf; --scroll-thumb-hover: #b3ae9f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1e1d; --panel: #262624; --panel-2: #30302d; --text: #ecebe6; --muted: #9c9a92;
      --border: #3a3936; --accent: #d97757; --you: #9c4a2f; --you-text: #fff;
      --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #1a1918;
      --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
      --scroll-thumb: #45433f; --scroll-thumb-hover: #5c5a55;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1e1d; --panel: #262624; --panel-2: #30302d; --text: #ecebe6; --muted: #9c9a92;
    --border: #3a3936; --accent: #d97757; --you: #9c4a2f; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #1a1918;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #45433f; --scroll-thumb-hover: #5c5a55;
    color-scheme: dark;
  }
  :root[data-theme="midnight"] {
    --bg: #0d1117; --panel: #161b22; --panel-2: #21262d; --text: #e6edf3; --muted: #8b949e;
    --border: #30363d; --accent: #58a6ff; --accent-text: #fff; --you: #1f6feb; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #010409;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #30363d; --scroll-thumb-hover: #484f58;
    color-scheme: dark;
  }
  :root[data-theme="forest"] {
    --bg: #1a211c; --panel: #222b24; --panel-2: #2c372e; --text: #e4ebe2; --muted: #93a394;
    --border: #38463b; --accent: #6fbf73; --accent-text: #fff; --you: #3f7a45; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #141a15;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #3a483d; --scroll-thumb-hover: #516353;
    color-scheme: dark;
  }
  :root[data-theme="ocean"] {
    --bg: #0f1c24; --panel: #16262f; --panel-2: #1e3340; --text: #e1eef5; --muted: #8fa9b8;
    --border: #2a4455; --accent: #3fb6d6; --accent-text: #fff; --you: #23809c; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #0a141a;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #2a4455; --scroll-thumb-hover: #3c6075;
    color-scheme: dark;
  }
  :root[data-theme="sunset"] {
    --bg: #241a1d; --panel: #2e2226; --panel-2: #3a2b30; --text: #f3e7e4; --muted: #b09a98;
    --border: #4a363c; --accent: #f08a5d; --accent-text: #fff; --you: #b5523b; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #1a1215;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #4a363c; --scroll-thumb-hover: #665058;
    color-scheme: dark;
  }
  :root[data-theme="slate"] {
    --bg: #e8ebef; --panel: #ffffff; --panel-2: #dde2e8; --text: #1d2530; --muted: #5f6b7a;
    --border: #ccd3dc; --accent: #3b6fb6; --accent-text: #fff; --you: #3b6fb6; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #eef1f5;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #bcc5d0; --scroll-thumb-hover: #a0abb8;
    color-scheme: light;
  }
  :root[data-theme="sepia"] {
    --bg: #f4ecd8; --panel: #fbf5e6; --panel-2: #eadfc4; --text: #3b3024; --muted: #7b6c55;
    --border: #d9ccaa; --accent: #a0522d; --accent-text: #fff; --you: #a0522d; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #efe5cb;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #cfc09a; --scroll-thumb-hover: #b8a87c;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  /* Scrollbars: slim, theme-coloured thumb on a transparent track so they don't pull focus. */
  * { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-thumb-hover); }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; white-space: nowrap; }
  #conn { width: 8px; height: 8px; border-radius: 50%; background: var(--err); flex: none; }
  #conn.on { background: var(--ok); }
  header .spacer { flex: 1; }
  .hbtn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 10px; font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .hbtn.on { color: var(--text); border-color: var(--accent); }
  .hbtn[hidden] { display: none; }

  /* usage meter chip */
  #usageBtn { display: flex; align-items: center; gap: 10px; padding: 4px 10px; }
  .meter { display: grid; gap: 2px; min-width: 64px; text-align: left; }
  .meter .lbl { font-size: 10.5px; line-height: 1; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .bar { height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--border); }
  .bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .4s; }
  .bar.warn > i { background: var(--warn); }
  .bar.hot > i { background: var(--err); }
  .bar.big { height: 12px; border-radius: 6px; }

  #agents {
    display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto;
    border-bottom: 1px solid var(--border); background: var(--panel); scrollbar-width: thin;
  }
  .agent {
    position: relative;
    flex: 0 0 auto; min-width: 150px; max-width: 230px; display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 8px; align-items: center;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel-2);
  }
  .agent[style*="--ac"] { border-color: var(--ac); background: color-mix(in srgb, var(--ac) 14%, var(--panel-2)); }
  .agent.pinned::after { content: '📌'; position: absolute; left: -4px; top: -7px; font-size: 11px; }
  .agent.dragover { outline: 2px dashed var(--accent); }
  .agrp { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 8px; border: 1px solid var(--border); border-radius: 14px; background: color-mix(in srgb, var(--text) 4%, transparent); }
  .agrp.dragover { outline: 2px dashed var(--accent); }
  .agrp-h { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; user-select: none; }
  .agrp-h .ct { font-weight: 500; }
  .agrp-h .gs { margin-left: auto; font-weight: 500; color: var(--accent); }
  .agrp-h .gs.need { color: var(--err); }
  .agrp-h button { padding: 0 4px; font-size: 11px; background: none; border: 0; color: var(--muted); }
  .agrp-b { display: flex; gap: 8px; }
  .agrp.collapsed .agrp-b { display: none; }
  .agrp.slim .agrp-b { flex-wrap: wrap; gap: 5px; max-width: 360px; }
  .agrp.slim .agent { min-width: 0; padding: 3px 9px; border-radius: 999px; display: flex; gap: 0; }
  .agrp.slim .agent .emo, .agrp.slim .agent .act, .agrp.slim .agent .mdl, .agrp.slim .agent .tools { display: none; }
  .agrp.slim .agent .nm { font-size: 12.5px; gap: 6px; }
  .agrp.slim .agent .dot { width: 9px; height: 9px; opacity: 1; background: #6b7280; }
  .agrp.slim .agent.working .dot { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .agrp.slim .agent.queued .dot, .agrp.slim .agent.held .dot { background: #f59e0b; }
  .agrp.slim .agent.needs .dot { background: #ef4444; }
  .agrp.slim.tiny { padding: 3px 6px 4px; gap: 3px; }
  .agrp.slim.tiny .agrp-b { gap: 1px 8px; max-width: 300px; }
  .agrp.slim.tiny .agent { padding: 0; border: 0; background: none; border-radius: 0; }
  .agrp.slim.tiny .agent .nm { font-size: 11px; gap: 4px; }
  .agrp.slim.tiny .agent .badge { display: none; }
  .agrp.slim.tiny .agent .dot { width: 8px; height: 8px; }
  .msg[style*="--ac"] .bubble { border-left: 3px solid var(--ac); background: color-mix(in srgb, var(--ac) 10%, var(--panel)); }
  .msg[style*="--ac"] .meta b { color: var(--ac); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); padding: 0; }
  .swatches button.sel { border-color: var(--text); }
  .agent .emo { font-size: 20px; grid-row: span 2; cursor: pointer; display: grid; }
  .spav { width: 34px; height: 34px; display: block; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); }
  .msg .av .spav { width: 34px; height: 34px; }
  .spav[src^="data:image/jpeg"] { border-radius: 50%; object-fit: cover; }
  .spav.mini { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; filter: none; }
  .agent .nm { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .agent .act { grid-column: 2 / 4; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent .mdl { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 0 4px; font-weight: 500; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .5; flex: none; }
  .agent.working .dot { background: var(--accent); opacity: 1; animation: pulse 1.2s infinite; }
  .agent.queued .dot, .agent.held .dot { background: var(--warn); opacity: 1; }
  .agent.missing { border-color: var(--err); }
  .agent.needs { border-color: var(--err); box-shadow: 0 0 0 1px var(--err) inset; }
  .agent .badge {
    position: absolute; top: -6px; right: -6px; background: var(--err); color: #fff; font-size: 11px; font-weight: 700;
    border-radius: 9px; padding: 0 6px; line-height: 18px; display: none;
  }
  .agent.needs .badge { display: block; }
  @keyframes pulse { 50% { opacity: .3; } }
  .agent .tools { display: flex; gap: 2px; flex: none; }
  /* row layout: name truncates first; model badge, cache pill and the buttons never shrink or wrap */
  .agent .nm { min-width: 0; overflow: hidden; }
  .agent .n { min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .mdl { flex: none; white-space: nowrap; }
  .agent .cpill { flex: none; margin-left: 0; white-space: nowrap; }
  .agent.working .cpill { display: none; }
  #agents { container-type: inline-size; }
  .agent .mdl .ms { display: none; }
  @container (max-width: 300px) { .agent .cpill .cw { display: none; } .agent .mdl .mf { display: none; } .agent .mdl .ms { display: inline; } }
  .agent .tools button {
    background: none; border: 0; padding: 2px 5px; border-radius: 6px; color: var(--muted); font-size: 13px;
  }
  .agent .tools button:hover { background: var(--border); color: var(--text); }

  main { flex: 1; overflow-y: auto; padding: 16px; }
  #log { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .empty { color: var(--muted); text-align: center; margin-top: 15vh; }
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg .av {
    flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    background: none; border: 0; font-size: 17px;
  }
  .msg .body { min-width: 0; flex: 1; }
  .msg .meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .msg .meta b { color: var(--text); font-weight: 600; }
  .tag.qd { background: #f59e0b; color: #000; font-weight: 700; letter-spacing: .5px; }
  .msg .bubble {
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px;
    padding: 9px 13px; overflow-wrap: anywhere;
  }
  .msg.you { flex-direction: row-reverse; }
  .msg.you .body { display: flex; flex-direction: column; align-items: flex-end; }
  .msg.you .bubble { background: var(--you); color: var(--you-text); border-color: transparent; border-radius: 14px 4px 14px 14px; max-width: 85%; }
  .msg.you .bubble code { background: rgba(0,0,0,.2); }
  .msg.draft .bubble { border-style: dashed; color: var(--muted); }
  .msg.draft .bubble p:last-child::after { content: '▍'; animation: pulse 1s infinite; margin-left: 1px; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); }
  .tag.needs { background: var(--err); border-color: var(--err); color: #fff; }
  .bubble p { margin: 0 0 .6em; white-space: pre-wrap; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; margin: .4em 0; font-size: 13px; }
  .bubble code { font-family: ui-monospace, Consolas, monospace; font-size: .92em; background: var(--code); padding: 1px 4px; border-radius: 4px; }
  .bubble pre code { background: none; padding: 0; }
  .bubble a { color: var(--accent); }
  .msg.you .bubble a { color: inherit; }
  .note { text-align: center; font-size: 13px; color: var(--muted); }
  .note.err, .msg.err .bubble { color: var(--err); }
  .msg.err .bubble { border-color: var(--err); white-space: pre-wrap; }
  .activity { font-size: 12px; color: var(--muted); padding-left: 42px; font-family: ui-monospace, Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body:not(.show-activity) .activity { display: none; }
  .trace { font-family: ui-monospace, Consolas, monospace; font-size: 12px; margin: 2px 0 2px 42px; padding: 4px 8px; border-left: 3px solid var(--line, #8884); background: #8881; border-radius: 4px; max-width: 900px; }
  .trace[hidden] { display: none; }
  .trace .th { color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
  .trace .th b { color: inherit; }
  .trace.k-tool { border-left-color: #4a90e2; }
  .trace.k-result { border-left-color: #8884; }
  .trace.k-thinking { border-left-color: #b07cd8; font-style: italic; }
  .trace.k-error, .trace.k-result.bad { border-left-color: #e5534b; }
  .trace.k-handoff, .trace.k-retry, .trace.k-steer { border-left-color: #d9a441; }
  .trace pre { margin: 3px 0 0; white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }
  .trace details > summary { cursor: pointer; color: var(--muted); }
  .trace .more { margin-top: 3px; font-size: 11px; cursor: pointer; }
  #verBtn.on { background: var(--accent, #4a90e2); color: #fff; }

  /* extras under a message: attachments, approvals, changed files */
  .proceedBtn { justify-self: end; font-weight: 700; letter-spacing: .08em; }
  .extras { display: grid; gap: 6px; margin-top: 6px; }
  .msg.you .extras { justify-items: end; }
  .card { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); padding: 8px 10px; font-size: 13px; }
  .card.alert { border-color: var(--err); }
  .card h4 { margin: 0 0 4px; font-size: 12.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .card li { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .card li .p { font-family: ui-monospace, Consolas, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .st { font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 0 4px; flex: none; }
  .st.added { background: var(--add-bg); color: var(--add-fg); }
  .st.deleted { background: var(--del-bg); color: var(--del-fg); }
  .st.modified { background: var(--panel-2); color: var(--muted); }
  .linkbtn { background: none; border: 0; color: var(--accent); padding: 0; font-size: 12px; text-decoration: underline; flex: none; }
  .btn { border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  .btn.danger { background: var(--err); color: #fff; border-color: transparent; font-weight: 600; }
  .filelist { margin: 8px 0 0; padding: 0; list-style: none; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
  .thumbs img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: block; }
  .file { font-size: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 3px 8px; background: var(--panel); color: inherit; text-decoration: none; }
  .stats { font-size: 11px; color: var(--muted); }

  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  #held {
    max-width: 820px; margin: 0 auto 8px; display: none; gap: 10px; align-items: center; flex-wrap: wrap;
    border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border-radius: 10px; padding: 8px 12px; font-size: 13px;
  }
  #held.on { display: flex; }
  #held span { flex: 1; min-width: 200px; }
  #chips { max-width: 820px; margin: 0 auto 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  #chips:empty { display: none; }
  .chip { font-size: 12px; border: 1px solid var(--border); border-radius: 14px; padding: 2px 4px 2px 10px; display: flex; align-items: center; gap: 4px; background: var(--panel-2); }
  .chip.up { opacity: .6; }
  .chip button { background: none; border: 0; padding: 0 4px; color: var(--muted); }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  .ibtn { height: 44px; width: 40px; flex: none; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); font-size: 18px; color: var(--muted); }

  /* settings panel */

  .srow .l { flex: 1; min-width: 0; } .srow b { font-weight: 600; } .srow p { margin: 2px 0 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .sub { font-size: 12px; color: var(--muted); margin: 0 2px 6px; }

  .bdg.free { color: var(--ok); border-color: var(--ok); } .bdg.rs { color: var(--muted); border-color: var(--border); }
  .sw { position: relative; width: 38px; height: 22px; flex: none; } .sw input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .sw i { position: absolute; inset: 0; background: var(--border); border-radius: 99px; transition: .2s; }

  .sw input:checked + i { background: var(--accent); } .sw input:checked + i::after { left: 19px; } .sw input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ctl { display: flex; gap: 10px; align-items: center; width: 250px; flex: none; } .ctl input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }

  #setBody .stx { width: 250px; flex: none; box-sizing: border-box; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
  .step { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex: none; }

  .warnbox { background: color-mix(in srgb, var(--warn) 12%, transparent); border: 1px solid var(--warn); border-radius: 10px; padding: 9px 12px; font-size: 12px; margin-bottom: 12px; }
  .okbox { background: color-mix(in srgb, var(--ok) 12%, transparent); border: 1px solid var(--ok); border-radius: 10px; padding: 9px 12px; font-size: 12px; margin-bottom: 12px; }
  .errbox { background: color-mix(in srgb, var(--err) 12%, transparent); border: 1px solid var(--err); border-radius: 10px; padding: 9px 12px; font-size: 12px; margin-bottom: 12px; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }

  #rsBanner { position: sticky; top: -16px; z-index: 2; display: flex; gap: 10px; align-items: center; background: color-mix(in srgb, var(--accent) 14%, var(--panel)); border: 1px solid var(--accent); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
  #rsBanner[hidden] { display: none; } #rsBanner span { flex: 1; }
  .snone { color: var(--muted); padding: 20px 0; text-align: center; }
  @media (max-width: 800px) {
    #setDlg { width: 100vw; max-width: 100vw; margin: auto 0 0; height: 92dvh; max-height: 92dvh; border-radius: 16px 16px 0 0; }
    #setBody { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }

  @media (max-width: 640px) {

  #hmore { display: contents; }
  #moreBtn { display: none; }

  /* ---- sidebar layout (Grok-style) ---- */

  #allBtn { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel-2); font-weight: 600; flex: none; }
  #grpBtn.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .agent .unread { position: absolute; right: 8px; top: 6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: var(--accent); color: var(--accent-text); font-size: 11px; line-height: 18px; text-align: center; font-weight: 700; }

  @media (min-width: 801px) {

</div>

  <div class="dlg-head"><h3>🛠 Settings</h3><span id="setSaved" class="setsaved"></span><input id="setQ" type="search" placeholder="Search settings…" autocomplete="off"><button class="x" data-close>×</button></div>
  <div class="dlg-body" id="setBody"></div>

  <div class="dlg-body" id="notifyBody"></div>
</dialog>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) {
      try { localStorage.setItem(k, v); } catch {}
      if (k.startsWith('crew-')) fetch('/api/prefs', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Crew': '1' }, body: JSON.stringify({ key: k, value: String(v) }) }).catch(() => {});
    },
  };
  // layout prefs (order, groups, slim, ...) live on the server so a refresh or another browser keeps them
  try {
    const x = new XMLHttpRequest(); x.open('GET', '/api/prefs', false); x.send();
    if (x.status === 200) {
      const sp = JSON.parse(x.responseText) || {};
      for (const k of Object.keys(sp)) { try { localStorage.setItem(k, sp[k]); } catch {} }
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('crew-') && !(k in sp) && k !== 'crew-theme') store.set(k, localStorage.getItem(k)); }
    }
  } catch {}
  const themeSel = $('#themeSel');
  const applyTheme = (t) => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
  { const t = store.get('crew-theme') || ''; applyTheme(t); themeSel.value = t; themeSel.onchange = () => { store.set('crew-theme', themeSel.value); applyTheme(themeSel.value); }; }
  let agents = {};
  let order = [];
  let userName = 'You';
  let defaultAgent = '';
  let usage = null;
  let flags = {};
  let schedules = [];
  let modelChoices = [];
  let effortChoices = [];
  let pushKey = '';
  const seen = new Set();
  const msgs = new Map(); // id -> { m, el }
  const drafts = new Map(); // agent id -> element

  // ---------- tiny, safe markdown ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function inline(s) {
    return s
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
      .replace(/^#{1,6}\s+(.*)$/gm, '<b>$1</b>');
  }
  function md(text) {
    const parts = esc(text).split(/```[^\n]*\n?/);
    return parts.map((p, i) => {
      if (i % 2) return `<pre><button type="button" class="cpbtn code" title="Copy code">Copy</button><code>${p.replace(/\n$/, '')}</code></pre>`;
      return p.split(/\n{2,}/).filter((x) => x.trim()).map((para) => `<p>${inline(para.trim())}</p>`).join('');
    }).join('');
  }
  // Copy buttons: whole message (raw markdown as written) and each code block.
  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch {} ta.remove();
    }
    const old = btn.dataset.l || (btn.dataset.l = btn.textContent);
    btn.textContent = 'Copied'; clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = old; }, 1400);
  }
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest?.('.cpbtn'); if (!b) return;
    if (b.classList.contains('code')) return copyText(b.parentElement.querySelector('code').textContent, b);
    const rec = msgs.get(b.closest('.msg')?.dataset.id); if (rec) copyText(String(rec.m.text || ''), b);
  });
  const time = (ts) => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const pct = (u) => Math.round((u || 0) * 100);
  const fmtTok = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n || 0);
  const fmtDur = (ms) => { const s = Math.round(ms / 1000); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m`; };
  const until = (t) => { const ms = t - Date.now(); if (ms <= 0) return 'now'; const m = Math.round(ms / 60000); return m < 60 ? `${m}m` : m < 1440 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${Math.floor(m / 1440)}d ${Math.floor(m % 1440 / 60)}h`; };
  const when = (t) => { const d = new Date(t); const today = new Date().toDateString() === d.toDateString(); return (today ? '' : d.toLocaleDateString([], { weekday: 'short' }) + ' ') + time(t); };
  function prettyModel(id) {
    if (!id) return '';
    const m = String(id).match(/(opus|sonnet|haiku|fable)-(\d+)(?:[-.](\d+))?/i);
    return m ? `${m[1][0].toUpperCase()}${m[1].slice(1)} ${m[2]}${m[3] ? '.' + m[3] : ''}` : String(id).replace(/^claude-/, '');
  }
  const tokens = (t) => (t.input || 0) + (t.output || 0) + (t.cacheRead || 0) + (t.cacheWrite || 0);

  // ---------- steampunk avatars ----------
  // Each agent gets a brass gear medallion with an etched emblem. Unknown ids fall back to a bare cog.
  const SP = (() => {
    const gearPath = (cx, cy, r, R, n) => {
      let d = '';
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, w = Math.PI / n * 0.55;
        const pts = [[r, a - w * 1.25], [R, a - w * 0.7], [R, a + w * 0.7], [r, a + w * 1.25]];
        for (const [rr, aa] of pts) d += (d ? 'L' : 'M') + (cx + rr * Math.cos(aa)).toFixed(2) + ' ' + (cy + rr * Math.sin(aa)).toFixed(2);
        const an = a + Math.PI / n;
        d += 'A' + r + ' ' + r + ' 0 0 1 ' + (cx + r * Math.cos(an + w * 0.1)).toFixed(2) + ' ' + (cy + r * Math.sin(an + w * 0.1)).toFixed(2);
      }
      return d + 'Z';
    };
    const rivets = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => {
      const a = i / 8 * Math.PI * 2 + Math.PI / 8;
      return `<circle cx="${(32 + 21.5 * Math.cos(a)).toFixed(1)}" cy="${(32 + 21.5 * Math.sin(a)).toFixed(1)}" r="1.1" fill="#f3d58a" stroke="#5a3a12" stroke-width=".4"/>`;
    }).join('');
    const frame = (emblem, face) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
      <defs>
        <radialGradient id="b" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#f7dc8c"/><stop offset=".45" stop-color="#c8942f"/><stop offset="1" stop-color="#6b4413"/></radialGradient>
        <radialGradient id="f" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="${face[0]}"/><stop offset="1" stop-color="${face[1]}"/></radialGradient>
        <linearGradient id="e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#c98a2a"/></linearGradient>
      </defs>
      <path d="${gearPath(32, 32, 27, 31.5, 14)}" fill="url(#b)" stroke="#4a2c0b" stroke-width="1"/>
      <circle cx="32" cy="32" r="24" fill="#3a2410" stroke="#e8c26a" stroke-width="1"/>
      <circle cx="32" cy="32" r="19.5" fill="url(#f)" stroke="#8a5a1c" stroke-width="1.2"/>
      ${rivets}
      <g fill="url(#e)" stroke="#3b230a" stroke-width=".9" stroke-linejoin="round" stroke-linecap="round">${emblem}</g>
    </svg>`;
    const E = {
      // Compass rose: the coordinator
      compass: [`<path d="M32 15 L35 29 L32 32 L29 29Z"/><path d="M32 49 L29 35 L32 32 L35 35Z" fill="#9c6a22"/>
        <path d="M15 32 L29 29 L32 32 L29 35Z" fill="#9c6a22"/><path d="M49 32 L35 35 L32 32 L35 29Z"/>
        <circle cx="32" cy="32" r="2.4" fill="#2a1a08"/>`, ['#1f3a3a', '#0c1a1c']],
      // Crenellated keep with a lit window
      castle: [`<path d="M23 47 V27 h-1.5 v-6 h4 v3 h3 v-3 h3 v3 h3 v-3 h3 v3 h3 v-3 h4 v6 H41 V47Z"/>
        <path d="M29.5 47 v-6 a2.5 2.5 0 0 1 5 0 v6Z" fill="#2a1a08"/><rect x="30.6" y="30" width="2.8" height="4.5" rx="1.2" fill="#ffb347" stroke="none"/>`, ['#2b2140', '#120c1e']],
      // Drafting dividers over a blueprint grid
      blueprint: [`<g stroke="#4f7fa8" stroke-width=".5" fill="none" opacity=".8"><path d="M18 26h28M18 32h28M18 38h28M26 18v28M32 18v28M38 18v28"/></g>
        <circle cx="32" cy="19.5" r="2.6"/><path d="M31 21.5 L22.5 45 L24.3 45.4 L32 24Z"/><path d="M33 21.5 L41.5 45 L39.7 45.4 L32 24Z"/>
        <path d="M25 36.5 Q32 39.5 39 36.5" fill="none" stroke="#ffe9a8" stroke-width="1.4"/>`, ['#16324f', '#081626']],
      // Crossed sabres with a hilt guard
      swords: [`<path d="M20 19 L23 18 L43 41 L41.5 42.5Z"/><path d="M44 19 L41 18 L21 41 L22.5 42.5Z"/>
        <path d="M38.5 41.5 l5 -4 l1.5 1.7 l-5 4Z"/><path d="M25.5 41.5 l-5 -4 l-1.5 1.7 l5 4Z"/>
        <circle cx="45" cy="46" r="2.2"/><circle cx="19" cy="46" r="2.2"/>`, ['#3f1414', '#1c0707']],
      // Crossed spanner and screwdriver
      tools: [`<path d="M21 23.5 a5.5 5.5 0 0 1 7.6 -3.6 l-3.4 3.4 l1.3 2.3 l2.3 1.3 l3.4 -3.4 a5.5 5.5 0 0 1 -3.6 7.6 L44.5 43 l-2.5 2.5 L28.2 31.6 A5.5 5.5 0 0 1 21 23.5Z"/>
        <path d="M43 19.5 l2.5 2.5 l-3 3 l-1.6 -.2 L31 34.7 l-1.7 -1.7 L39.2 23.1 l-.2 -1.6Z"/><path d="M29.6 33.2 l1.7 1.7 l-6.2 6.2 a1.6 1.6 0 0 1 -2.3 0 l.6 -.6 a1.6 1.6 0 0 1 0 -2.3Z" fill="#9c6a22"/>`, ['#14332a', '#071a14']],
      // Cottage with a steaming chimney and a gauge
      house: [`<path d="M18.5 32 L32 20 L45.5 32 L43 32 L43 46 L21 46 L21 32Z"/><rect x="37" y="21" width="3.6" height="7"/>
        <path d="M38.8 19 q-2 -2.5 0 -4.5 q2 -2 .4 -4" fill="none" stroke="#e9e2cf" stroke-width="1.3" opacity=".85"/>
        <circle cx="32" cy="37" r="4.3" fill="#f3ead2"/><path d="M32 37 L34.4 34.6" stroke="#7a1a0a" stroke-width="1.2"/><circle cx="32" cy="37" r=".9" fill="#3b230a"/>`, ['#2c2a14', '#141306']],
      _: [`<path d="${gearPath(32, 32, 8, 11, 8)}"/><circle cx="32" cy="32" r="3.5" fill="#2a1a08"/>`, ['#2a2a2a', '#111']],
    };
    const cache = {};
    // Emblem comes from the agent's "avatar" in crew.config.json; the coordinator defaults to the compass.
    return (id) => {
      const key = agents[id]?.avatar || (id === 'assistant' ? 'compass' : id);
      return cache[key] ??= 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(frame(...(E[key] || E._)));
    };
  })();
  // Custom icons (browser-saved): an emoji per agent, drawn as an SVG data URL so it works anywhere an <img> does.
  let crewIcons = (() => { try { return JSON.parse(store.get('crew-icons')) || {}; } catch { return {}; } })();
  const emojiSrc = (e) => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text x="32" y="32" font-size="46" text-anchor="middle" dominant-baseline="central">${e.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</text></svg>`);
  let crewPics = (() => { try { return JSON.parse(store.get('crew-pics')) || {}; } catch { return {}; } })();
  const iconSrc = (id) => crewPics[id] || (crewIcons[id] ? emojiSrc(crewIcons[id]) : SP(id));
  const avatar = (id, cls = '') => `<img class="spav ${cls}" src="${iconSrc(id)}" alt="">`;

  // ---------- dialogs ----------
  document.querySelectorAll('dialog').forEach((d) => {
    d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
  });
  const open = (id) => { const d = $(id); if (!d.open) d.showModal(); };

  // ---------- usage meter ----------
  function setBar(bar, u) {
    bar.classList.toggle('warn', u >= 0.7 && u < 0.9);
    bar.classList.toggle('hot', u >= 0.9);
    bar.querySelector('i').style.width = Math.min(100, pct(u)) + '%';
  }
  function renderUsage() {
    const l = usage?.limits;
    const f = l?.fiveHour, w = l?.weekly;
    $('#u5').textContent = f ? pct(f.utilization) + '%' : '–';
    $('#uw').textContent = w ? pct(w.utilization) + '%' : '–';
    setBar($('#b5'), f?.utilization || 0);
    setBar($('#bw'), w?.utilization || 0);
    $('#usageBtn').title = l ? `5-hour: ${pct(f?.utilization)}%${f?.resetsAt ? `, resets in ${until(f.resetsAt)}` : ''}\nWeekly: ${pct(w?.utilization)}%${w?.resetsAt ? `, resets in ${until(w.resetsAt)}` : ''}\nUpdated ${when(l.updatedAt)}` : 'No usage reading yet: it arrives with the next agent reply.';
    const g = usage?.guard;
    $('#held').classList.toggle('on', !!g && Object.values(agents).some((a) => a.status === 'held'));
    if (g) $('#heldText').textContent = `Holding new work: ${g.window} usage is ${pct(g.utilization)}% (guard at ${pct(g.threshold)}%). Resumes ${when(g.resumesAt)}.`;
    if ($('#usageDlg').open) renderUsageDialog();
  }
  function renderUsageDialog() {
    const l = usage?.limits;
    const win = (name, w) => `<div class="section"><div class="row"><b class="grow">${name}</b><span>${w ? pct(w.utilization) + '%' : '–'}</span></div>
      <div class="bar big ${w && w.utilization >= 0.9 ? 'hot' : w && w.utilization >= 0.7 ? 'warn' : ''}"><i style="width:${w ? Math.min(100, pct(w.utilization)) : 0}%"></i></div>
      <div class="small">${w?.resetsAt ? `Resets in ${until(w.resetsAt)} (${when(w.resetsAt)})` : w?.expired ? 'Window has reset; next reading arrives with the next reply.' : ''}</div></div>`;
    const b = usage?.budget || {};
    const opts = (cur) => [0.5, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95, 1].map((v) => `<option value="${v}" ${Math.abs(v - cur) < 1e-6 ? 'selected' : ''}>${pct(v)}%</option>`).join('');
    const rows = order.map((id) => {
      const t = usage?.agents?.[id] || { today: {}, week: {} };
      return `<tr><td>${avatar(id, 'mini')} ${esc(agents[id]?.name || id)}</td><td>${t.today.runs || 0}</td><td>${fmtTok(tokens(t.today))}</td><td>${t.week.runs || 0}</td><td>${fmtTok(tokens(t.week))}</td></tr>`;
    }).join('');
    const tot = usage?.total || { today: {}, week: {} };
    $('#usageBody').innerHTML = `
      ${l ? win('5-hour window', l.fiveHour) + win('Weekly', l.weekly) + `<div class="small">Your whole Claude account, including Claude Code you use yourself. Last reading ${when(l.updatedAt)}; it refreshes with every agent reply.</div>`
        : '<div class="small">No reading yet. It arrives with the next agent reply.</div>'}
      <div class="section"><h5>Budget guard</h5>
        <div class="row"><label class="row"><input type="checkbox" id="bgOn" ${b.enabled ? 'checked' : ''}> Hold new work when usage is high</label></div>
        <div class="row small" style="margin-top:6px">5-hour at <select id="bg5">${opts(b.fiveHour)}</select> · weekly at <select id="bgW">${opts(b.weekly)}</select></div>
        <div class="small" style="margin-top:6px">Held messages wait and run automatically when the window resets.${usage?.overrideUntil ? ` <b>Overridden until ${when(usage.overrideUntil)}.</b>` : ''}</div>
      </div>
      <div class="section"><h5>By agent</h5><div class="scroll-x"><table>
        <tr><th>Agent</th><th>Runs today</th><th>Tokens today</th><th>Runs 7d</th><th>Tokens 7d</th></tr>${rows}
        <tr><th>Total</th><th>${tot.today.runs || 0}</th><th>${fmtTok(tokens(tot.today))}</th><th>${tot.week.runs || 0}</th><th>${fmtTok(tokens(tot.week))}</th></tr>
      </table></div></div>`;
    const saveBudget = () => api('/api/budget', { enabled: $('#bgOn').checked, fiveHour: +$('#bg5').value, weekly: +$('#bgW').value });
    $('#bgOn').onchange = $('#bg5').onchange = $('#bgW').onchange = saveBudget;
  }
  $('#usageBtn').onclick = () => { renderUsageDialog(); open('#usageDlg'); };

  // ---------- prompt-cache countdown pill (mod 2) ----------
  // Shows how long the agent's prompt cache should stay warm after its last reply. Only drawn when the
  // stream reported cache tokens; the lifetime is only claimed when the stream said which cache tier was written.
  function cacheState(id) {
    const l = usage?.last?.[id];
    if (!l || !l.cacheReported) return null;
    if (!l.ttlMs) return { text: 'cache ?', value: '?', cls: '', title: 'Prompt cache lifetime unknown: the stream did not report it.' };
    const left = l.at + l.ttlMs - Date.now();
    const full = l.ttlMs >= 3600e3 ? '1h' : '5m';
    if (left <= 0) return { text: 'cache cold', value: 'cold', cls: 'cold', title: `Prompt cache: the ${full} cache has expired. The next message re-reads the full context.` };
    const s = Math.ceil(left / 1000);
    const value = s >= 3600 ? Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm' : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    return { text: `cache ${value}`, value, cls: left < 60e3 ? 'low' : 'warm', title: `Prompt cache (${full}) warm until ${time(l.at + l.ttlMs)}.` };
  }
  function paintCachePills() {
    for (const id of Object.keys(agents)) {
      const el = document.querySelector('#agent-' + id + ' .cpill');
      if (!el) continue;
      const c = cacheState(id);
      el.hidden = !c;
      if (c) { el.replaceChildren(Object.assign(document.createElement('span'), { className: 'cw', textContent: 'cache ' }), c.value); el.className = 'cpill ' + c.cls; el.title = c.title; }
    }
  }
  setInterval(paintCachePills, 1000);

  // ---------- refresh-chat banner (mod 3): offers only; the click does the work ----------
  function paintRefreshBar() {
    const bar = $('#refreshBar');
    if (!bar) return;
    const list = Object.values(agents).filter((a) => a.refreshSuggested);
    bar.hidden = !list.length;
    bar.innerHTML = list.map((a) => `<div class="rrow"><span>${esc(a.name)}'s chat is large (${fmtTok(a.contextTokens)} tokens, over ${fmtTok(a.refreshAt)}). Refreshing writes a summary and starts a new session with it.</span><button class="btn" data-refresh="${esc(a.id)}" ${a.status !== 'idle' ? 'disabled title="Available when idle"' : ''}>${a.refreshing ? 'Refreshing…' : 'Refresh chat'}</button></div>`).join('');
    bar.querySelectorAll('[data-refresh]').forEach((b) => { b.onclick = async () => {
      b.disabled = true; b.textContent = 'Writing summary…';
      await api('/api/refresh', { agent: b.dataset.refresh });
    }; });
  }

  // ---------- overview panel (mod 1) ----------
  // Tokens and cost appear only when the stream reported them; otherwise "unknown".
  const tokKnown = (t) => (t.tokRuns || 0) > 0 || tokens(t) > 0;
  const costKnown = (t) => (t.costRuns || 0) > 0 || (t.costUSD || 0) > 0;
  const fmtTokU = (t) => !(t.runs) ? '0' : tokKnown(t) ? fmtTok(tokens(t)) : 'unknown';
  const fmtCostU = (t) => !(t.runs) ? '$0.00' : costKnown(t) ? '$' + (t.costUSD || 0).toFixed(2) : 'unknown';
  const fmtReset = (ts) => { if (!ts) return ''; const m = Math.max(0, Math.round((ts - Date.now()) / 60000)); return ' ↻' + (m >= 1440 ? Math.floor(m / 1440) + 'd' : m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60) + 'm' : m + 'm'); };
  const gauge = (p, warn, tick) => `<span class="fd-gauge">${tick != null && tick >= 0 && tick <= 100 ? `<b class="fd-tick" style="left:${tick}%" title="refresh threshold"></b>` : ''}<i class="${p >= warn ? 'warn' : ''}" style="width:${Math.min(100, Math.max(0, p))}%"></i></span>`;
  async function renderOverview() {
    let u = usage;
    try { u = await (await fetch('/api/usage')).json(); } catch { /* fall back to cached summary */ }
    const l = u?.limits, tot = u?.total || { today: {}, week: {} };
    const ids = order.length ? order : Object.keys(agents);
    const working = ids.filter((id) => agents[id]?.status === 'working').length;
    const queued = ids.reduce((n, id) => n + (agents[id]?.queued || 0), 0);
    const cur = sel && !String(sel).includes(',') && agents[sel] ? sel : null;

      const img = new Image(); img.onload = () => {
        const c = document.createElement('canvas'), n = 96, k = Math.max(n / img.width, n / img.height);
        c.width = c.height = n; const x = c.getContext('2d');
        x.drawImage(img, (n - img.width * k) / 2, (n - img.height * k) / 2, img.width * k, img.height * k);
        crewPics[id] = c.toDataURL('image/jpeg', 0.85); saveCrewPrefs(); renderAgentDialog(id);
      };
      img.src = URL.createObjectURL(f);
    };
    $('#agModel').onchange = () => api(`/api/agents/${id}/model`, { model: $('#agModel').value || null });
    $('#agEffort').onchange = () => api(`/api/agents/${id}/effort`, { effort: $('#agEffort').value || null });
    $('#agReset').onclick = () => {
      const w = a.status === 'working' ? ' It will finish what it is doing first.' : '';
      if (confirm(`Start a fresh conversation with ${a.name}? It will forget this chat's context.${w}`)) api(`/api/agents/${id}/reset`);
    };
    if ($('#agStop')) $('#agStop').onclick = () => api(`/api/agents/${id}/stop`);
    $('#agMention').onclick = () => { $('#agentDlg').close(); mention(id); };
    if ($('#agJump')) $('#agJump').onclick = () => { $('#agentDlg').close(); jumpTo(a.needsYou.msgId); };
  }

  function mention(id) {
    const ta = $('#input');
    const tag = '@' + id + ' ';
    if (!ta.value.includes(tag)) ta.value = tag + ta.value;
    ta.focus();
    autosize();
  }
  function jumpTo(id) {
    const x = id && msgs.get(id);
    if (!x) return;
    x.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    x.el.animate([{ background: 'color-mix(in srgb, var(--accent) 18%, transparent)' }, { background: 'transparent' }], { duration: 1600 });
  }

  // ---------- messages ----------
  function nameOf(id) { return id === 'user' ? userName : agents[id]?.name || id; }

  function renderExtras(m, box) {
    const f = flags[m.id] || {};
    let html = '';
    if (m.attachments?.length) {
      const imgs = m.attachments.filter((a) => a.type?.startsWith('image/'));
      const files = m.attachments.filter((a) => !a.type?.startsWith('image/'));
      if (imgs.length) html += `<div class="thumbs">${imgs.map((a) => `<a href="/api/uploads/${esc(a.id)}" target="_blank"><img src="/api/uploads/${esc(a.id)}" alt="${esc(a.name)}" loading="lazy"></a>`).join('')}</div>`;
      if (files.length) html += `<div class="thumbs">${files.map((a) => `<a class="file" href="/api/uploads/${esc(a.id)}">📄 ${esc(a.name)}</a>`).join('')}</div>`;
    }
    if (m.denials?.length) {
      html += `<div class="card alert"><h4>${f.approved ? '✅ Approved' : 'Permission needed'}</h4><ul>${m.denials.map((d) => `<li><span class="p" title="${esc(d.rule)}">${esc(d.label)}</span></li>`).join('')}</ul>
        ${f.approved ? '' : `<div class="row" style="margin-top:6px"><button class="btn primary" data-approve>Approve once and continue</button><span class="small">Only these exact actions, for its next run.</span></div>`}</div>`;
    }
    if (m.changes?.files?.length) {
      const c = m.changes;
      const undone = f.undone;
      html += `<div class="card"><h4>${undone ? '↩ Undone · ' : ''}${c.files.length + (c.more || 0)} file${c.files.length + (c.more || 0) === 1 ? '' : 's'} changed
        ${c.repo && !undone ? '<span class="grow"></span><button class="btn" data-undo>Undo</button>' : ''}</h4>
        <ul>${c.files.slice(0, 30).map((x) => `<li><span class="st ${x.status}">${x.status === 'added' ? 'A' : x.status === 'deleted' ? 'D' : 'M'}</span><span class="p" title="${esc(x.path)}">${esc(x.path)}</span>${c.repo ? `<button class="linkbtn" data-diff="${esc(x.path)}">diff</button>` : ''}</li>`).join('')}</ul>
        ${c.files.length > 30 || c.more ? `<div class="small">…and ${c.files.length - 30 + (c.more || 0)} more</div>` : ''}
        ${undone?.skipped?.length ? `<div class="small">Not undone: ${undone.skipped.map((s) => esc(s.path)).join(', ')}</div>` : ''}
        ${c.repo ? '' : '<div class="small">Not a git folder, so no diff or undo.</div>'}</div>`;
    }
    if (m.stats && m.from !== 'user') {
      html += `<div class="stats">${[prettyModel(m.model), m.effort ? 'effort ' + m.effort : '', m.stats.ms ? fmtDur(m.stats.ms) : ''].filter(Boolean).join(' · ')}</div>`;
    }
    box.innerHTML = html;
    box.style.display = html ? '' : 'none';
    box.querySelector('[data-approve]')?.addEventListener('click', (e) => { e.target.disabled = true; api('/api/approve', { id: m.id }); });
    box.querySelector('[data-undo]')?.addEventListener('click', async (e) => {
      if (!confirm(`Undo ${nameOf(m.from)}'s changes to ${m.changes.files.length} file(s)? Files changed again since then are left alone.`)) return;
      e.target.disabled = true;
      const r = await api(`/api/changes/${m.id}/undo`);
      if (!r.ok) e.target.disabled = false;
    });
    box.querySelectorAll('[data-diff]').forEach((b) => b.addEventListener('click', () => showDiff(m, b.dataset.diff)));
  }

  async function showDiff(m, file) {
    $('#diffTitle').textContent = file;
    $('#diffBody').innerHTML = '<div class="small">Loading…</div>';
    open('#diffDlg');
    const r = await fetch(`/api/changes/${m.id}/diff?path=${encodeURIComponent(file)}`);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $('#diffBody').innerHTML = `<div class="small">${esc(j.error || 'Could not load the diff.')}</div>`; return; }
    const lines = String(j.diff).split('\n').map((l) => {
      const cls = l.startsWith('+++') || l.startsWith('---') || l.startsWith('diff ') || l.startsWith('index ') ? 'h'
        : l.startsWith('@@') ? 'h' : l.startsWith('+') ? 'a' : l.startsWith('-') ? 'd' : '';
      return `<span class="${cls}">${esc(l) || ' '}</span>`;
    }).join('');
    $('#diffBody').innerHTML = `<div class="small">The file now, compared with how it was just before ${esc(nameOf(m.from))}'s turn (${time(m.ts)}).</div><pre class="diff">${lines}</pre>`;
  }

  function render(m) {
    if (seen.has(m.id)) return;
    seen.add(m.id);
    const log = $('#log');
    log.querySelector('.empty')?.remove();
    const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 160;
    let el;
    if (m.kind === 'activity') {
      el = document.createElement('div');
      el.className = 'activity';
      el.innerHTML = `${avatar(m.from, 'mini')} ${esc(nameOf(m.from))} · ${esc(m.text)}`;
    } else if (m.kind === 'system') {
      el = document.createElement('div');
      el.className = 'note';
      el.textContent = m.text;
      if (m.changes) {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'max-width:520px;margin:6px auto 0;text-align:left';
        el.appendChild(wrap);
        renderExtras(m, wrap);
      }
    } else {
      const you = m.from === 'user';
      el = document.createElement('div');
      el.dataset.id = m.id;
      el.className = `msg${you ? ' you' : ''}${m.kind === 'error' ? ' err' : ''}`;
      if (!you) { el.dataset.from = m.from; paintMsg(el, m.from); }
      const to = (m.to || []).map((t) => `<span class="tag">→ ${esc(nameOf(t))}</span>`).join('');
      const needs = m.needs ? `<span class="tag needs" title="${esc(m.needs)}">Needs you</span>` : '';
      el.innerHTML = `${you ? '' : `<div class="av">${avatar(m.from)}</div>`}
        <div class="body"><div class="meta">${you ? '' : `<b>${esc(nameOf(m.from))}</b>`}<span>${time(m.ts)}</span>${to}${needs}${you || m.kind === 'error' ? '' : '<button type="button" class="cpbtn" title="Copy message text">Copy</button>'}</div>
        <div class="bubble">${m.kind === 'error' ? esc(m.text) : md(m.text)}</div><div class="extras"></div></div>`;
      renderExtras(m, el.querySelector('.extras'));
      // One-tap PROCEED on the newest agent reply: tells that agent to go ahead without waiting or asking.
      document.querySelectorAll('.proceedBtn').forEach((b) => b.remove());
      // Only offered when the reply is waiting on the user: flagged "Needs you" or ending in a question.
      if (!you && m.kind === 'chat' && (m.needs || /\?[\s*_)\]"'`]*$/.test(String(m.text || '').trim()))) {
        const pb = document.createElement('button');
        pb.className = 'btn primary proceedBtn'; pb.textContent = 'PROCEED';
        pb.onclick = async () => {
          pb.disabled = true;
          await api('/api/send', { text: `@${m.from} Proceed. Go ahead now; do not wait, ask, or hold off for me.`, attachments: [] });
          pb.remove();
        };
        el.querySelector('.extras').appendChild(pb);
      }
      // A finished reply replaces that agent's live draft.
      if (!you && drafts.has(m.from)) { drafts.get(m.from).remove(); drafts.delete(m.from); }
    }
    msgs.set(m.id, { m, el });
    if (typeof sel === 'string' && sel) el.hidden = !matches(m); noteUnread(m);
    // Live "typing" bubbles stay at the bottom; everything else goes above them.
    const draftFirst = [...drafts.values()][0];
    if (draftFirst) log.insertBefore(el, draftFirst); else log.appendChild(el);
    if (nearBottom || m.from === 'user') scroller.scrollTop = scroller.scrollHeight;
    return el;
  }

  function renderDraft(agent, text) {
    let el = drafts.get(agent);
    if (!text) { if (el) { el.remove(); drafts.delete(agent); } return; }
    const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 160;
    if (!el) {
      el = document.createElement('div');
      el.className = 'msg draft';
      el.dataset.from = agent; paintMsg(el, agent);
      el.innerHTML = `<div class="av">${avatar(agent)}</div><div class="body"><div class="meta"><b>${esc(nameOf(agent))}</b><span>typing…</span></div><div class="bubble"></div></div>`;
      $('#log').appendChild(el);
      drafts.set(agent, el);
    }
    el.querySelector('.bubble').innerHTML = md(text) || '<p></p>';
    if (nearBottom) scroller.scrollTop = scroller.scrollHeight;
  }

  // ---------- server ----------
  async function api(url, body) {
    const r = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Crew': '1' },
      body: JSON.stringify(body || {}),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok && j.error) alert(j.error);
    return { ...j, ok: r.ok && j.ok !== false };
  }

  async function load() {
    const r = await fetch('/api/state');
    if (r.status === 401) { location.reload(); return; }
    const s = await r.json();
    userName = s.userName;
    defaultAgent = s.defaultAgent;
    usage = s.usage;
    flags = s.flags || {};
    schedules = s.schedules || [];
    modelChoices = s.modelChoices || [];
    effortChoices = s.effortChoices || [];
    pushKey = s.pushKey || '';
    if (s.signOutUrl) {
      $('#signOut').href = s.signOutUrl;
      $('#signOut').title = `Signed in as ${s.signedInAs}`;
      $('#signOut').hidden = false;
    }
    order = s.agents.map((a) => a.id);
    agents = Object.fromEntries(s.agents.map((a) => [a.id, a]));
    s.agents.forEach(renderAgent);
    $('#hint').textContent = `Goes to ${agents[defaultAgent].name} unless you @mention someone (${order.map((id) => '@' + id).join(', ')}, @all). Tap an agent to mention it.`;
    if (!s.history.length && !$('#log').children.length) {
      $('#log').innerHTML = '<div class="empty">Say hi to the crew. Your agents run Claude Code on this PC with your own login.</div>';
    }
    s.history.forEach(render);
    for (const [id, f] of Object.entries(flags)) { const x = msgs.get(id); if (x) { const box = x.el.querySelector('.extras') || x.el.querySelector('div[style]'); if (box) renderExtras(x.m, box); } }
    for (const [agent, text] of Object.entries(s.drafts || {})) renderDraft(agent, text);
    renderUsage();
    if ($('#schedDlg').open) renderSchedules();
    scroller.scrollTop = scroller.scrollHeight;
    syncNotifyBtn();
  }

  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => { $('#conn').className = 'on'; $('#conn').title = 'Connected'; load(); };
    es.onerror = () => { $('#conn').className = ''; $('#conn').title = 'Reconnecting…'; };
    es.addEventListener('agent', (e) => { const a = JSON.parse(e.data); agents[a.id] = a; renderAgent(a); renderUsage(); });
    es.addEventListener('message', (e) => {
      const m = JSON.parse(e.data);
      render(m);
      if (document.hidden && !pushActive && m.from !== 'user' && (m.kind === 'chat' || m.kind === 'error')) notifyLocal(m);
    });
    es.addEventListener('trace', (e) => { renderTrace(JSON.parse(e.data)); });
    es.addEventListener('draft', (e) => { const d = JSON.parse(e.data); renderDraft(d.agent, d.text); });
    es.addEventListener('usage', (e) => { usage = JSON.parse(e.data); renderUsage(); paintCachePills(); });
    es.addEventListener('flags', (e) => {
      const d = JSON.parse(e.data);
      flags[d.id] = d.flags;
      const x = msgs.get(d.id);
      if (x) { const box = x.el.querySelector('.extras') || x.el.querySelector('div[style]'); if (box) renderExtras(x.m, box); }
    });
    es.addEventListener('schedules', (e) => { schedules = JSON.parse(e.data); if ($('#schedDlg').open) renderSchedules(); });
  }

  // ---------- machines ----------
  let machTimer = null;

        ? `<div class="small" style="margin-top:6px"><b>New PC?</b> Open PowerShell on it, paste this one line, press Enter:</div><textarea readonly rows="3" style="width:100%" onclick="this.select()">${esc(j.line)}</textarea><button class="btn" id="machCopy">Copy</button>`
        : '<div class="small">Already installed on the other PC? Enter ' + (j.hub ? esc(j.hub) : "this PC's address") + ' and the code in its Machines panel. For a brand new PC, turn on "allowLan" or Cloudflare so it can reach this one.</div>');

  function startMachTimer() {

    machTimer = setInterval(() => { if (!$('#setDlg').open) clearInterval(machTimer); else if ($('#machCode') && !$('#machCode').querySelector('b') && !$('#setDlg').contains(document.activeElement.closest('input') || null)) renderMachines(); }, 15000);

    const r = await fetch('/api/integrations' + (force ? '?refresh=1' : ''));

    const d = await r.json();
    const dot = (s) => `<span style="color:${s === 'ok' ? '#4caf50' : s === 'auth' ? '#e0a030' : s === 'idle' ? '#888' : '#e05050'}">●</span>`;
    const who = (ids) => ids.length >= d.allAgents.length ? 'All agents' : ids.map((id) => esc(id)).join(', ');
    const mcp = d.mcp.map((m) => `<div class="job"><div class="row"><b>${dot(m.status)} ${esc(m.name)}</b><span class="small grow">${esc(m.statusText)}</span></div>
      <div class="small">Can use it: <b>${who(m.agents)}</b></div><div class="small" style="word-break:break-all">${esc(m.target)}</div></div>`).join('')

  const INT_CATALOG = [

  // ---------- schedules ----------
  const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function dayText(days) {
    const k = [...days].sort().join('');
    return k === '0123456' ? 'Every day' : k === '12345' ? 'Weekdays' : k === '06' ? 'Weekends' : days.map((d) => DAY[d]).join(', ');

        <div>${esc(j.text)}</div>
        <div class="row"><button class="btn" data-run>Run now</button><button class="btn" data-del>Delete</button>${j.lastRun ? `<span class="small">Last ran ${when(j.lastRun)}</span>` : ''}</div>
      </div>`).join('') : '<div class="small">No scheduled jobs yet.</div>';
    $('#schedBody').innerHTML = `${list}
      <div class="section"><h5>New job</h5>
        <div class="row"><select id="sjAgent">${agentOpts}</select>
          <select id="sjKind"><option value="daily">At a time</option><option value="interval">Every few hours</option></select>
          <span id="sjDaily" class="row"><input type="time" id="sjTime" value="08:00">

    async function bindSourceAndUninstall() {

        ${row('New source', 'hast3/claudecrew, Hrubak/claudecrew, or a custom git URL, then a branch.', `<select class="stx" id="swKind"><option value="hast3">hast3/claudecrew</option><option value="hrubak">Hrubak/claudecrew</option><option value="custom">Custom git URL…</option></select>`)}

        go.disabled = true;
      } else {
        warn.hidden = false; warn.className = 'okbox';
        warn.textContent = 'Working tree is clean. Switching will fetch, switch, npm install, and ask you to restart.';

      go.onclick = async () => {
        const kind = $('#swKind').value;

      const unOpen = $('#unOpen'), unPanel = $('#unPanel'), unGo = $('#unGo');
      const selectedUnIds = () => [...unPanel.querySelectorAll('input[type=checkbox][data-id]:checked')].map((el) => el.getAttribute('data-id'));
      const renderGrp = (title, items, line) => {
        if (!items || !items.length) return '';
        return '<div class="sub">' + esc(title) + '</div>' + items.map((it) => '<label class="srow" style="cursor:pointer"><input type="checkbox" data-id="' + esc(it.id) + '" ' + (it.defaultChecked ? 'checked' : '') + '> <div class="l"><b>' + esc(line(it)) + '</b><p>' + esc(it.reason || '') + (it.outsideProfile ? ' Outside your user profile (unchecked).' : '') + '</p></div></label>').join('');
      };
      let unScan = null;
      const refreshUn = async () => {
        if (!unScan) unScan = await fetch('/api/uninstall/scan').then((r) => r.json()).catch((e) => ({ error: e.message }));
        const box = $('#unScanList');
        if (unScan.error) box.innerHTML = '<div class="errbox">' + esc(unScan.error) + '</div>';
        else if (!box.dataset.filled) {
          const g = unScan.groups || {};
          box.innerHTML = renderGrp('Folders', g.folders, (i) => i.path)
            + renderGrp('Processes', g.processes, (i) => 'PID ' + i.pid + ' ' + (i.name || ''))
            + renderGrp('Tray', g.tray, (i) => 'Tray PID ' + i.pid)
            + renderGrp('Shortcuts', g.shortcuts, (i) => (i.path || ''))
            + renderGrp('Scheduled tasks', g.scheduledTasks, (i) => i.name)

          box.dataset.filled = '1';

        const ids = selectedUnIds();
        const prev = await fetch('/api/uninstall/preview?dataMode=' + encodeURIComponent($('#unMode').value) + (ids.length ? '&selectedIds=' + encodeURIComponent(ids.join(',')) : '')).then((r) => r.json()).catch((e) => ({ error: e.message }));
        const list = $('#unList');
        list.hidden = false;
        if (prev.error) { list.className = 'errbox'; list.textContent = prev.error; return prev; }
        const dels = (prev.willDelete || []).filter((d) => d.rel !== '.').map((d) => '<li>' + esc(d.rel || d.path || '') + '</li>').join('');
        list.className = 'errbox';
        list.innerHTML = '<b>Will be deleted</b><ul class="filelist">' + dels + '</ul>' + (prev.backupPath ? '<p>Backup: <span class="mono">' + esc(prev.backupPath) + '</span></p>' : '');
        return prev;
      };
      unOpen.onclick = async () => { unPanel.hidden = false; unOpen.disabled = true; await refreshUn(); };
      $('#unMode').onchange = refreshUn;
      $('#unScanList').addEventListener('change', refreshUn);

      };
    }

    const SECS = [
      ['gen', '⚙', 'General', '', `<div class="scard">

        <div class="ssh"><h4>Switch source</h4></div>
        <div class="scard" id="swCard"><div class="srow"><div class="l"><b>Current source</b><p>Loading…</p></div></div></div>
        <div id="swWarn" hidden></div>
        <div class="srow2" style="margin-bottom:14px"><button class="btn primary" id="swGo" type="button" disabled>Switch and restart</button></div>
        <div class="ssh"><h4>Danger zone</h4></div>
        <div class="scard" id="unCard">
          <div class="srow"><div class="l"><b>Uninstall Claude Crew</b><p>Stop Crew, remove shortcuts and autostart, and choose what happens to your data. External project folders are never deleted.</p></div>
            <button class="btn danger" id="unOpen" type="button">Uninstall Claude Crew</button></div>
          <div id="unPanel" hidden>
            <div id="unScanList"></div>
            <div class="srow"><div class="l"><b>Your data</b><p>Backup is the default. The zip is written outside every selected install folder.</p></div>
              <select class="stx" id="unMode"><option value="backup" selected>Back up (recommended)</option><option value="keep">Keep data in the folder</option><option value="delete">Delete everything</option></select></div>
            <div id="unList" class="errbox" hidden></div>
            <div class="srow"><div class="l"><b>Type UNINSTALL to confirm</b></div><input class="stx" id="unConfirm" placeholder="UNINSTALL" autocomplete="off"></div>
            <div class="srow2"><button class="btn danger" id="unGo" type="button" disabled>Confirm uninstall</button></div>
          </div>
        </div>`],
      ['mod', '🧠', 'Models & Effort', 'cost risk', `<div class="scard">
        ${row('Default model', '“Let Crew choose” picks by task size.', sel('sModel', opt('', 'Let Crew choose', s.model) + cfg.modelChoices.map((m) => opt(m, m, s.model)).join('')))}
        ${row('Default effort', 'Higher effort thinks longer and spends more tokens. Agents can override it.', sel('sEffort', cfg.effortChoices.map((e) => opt(e, e, s.effort)).join('')), BD.cost)}
        ${row('Permission mode', 'What agents may do without asking you first. Looser modes can edit files and run commands unattended.', sel('sPerm', cfg.permissionModes.map((m) => opt(m, m, s.permissionMode)).join('')), BD.risk)}
        ${row('Agents working at once', 'More in parallel is faster but uses your plan faster.', stp('sConc', s.maxConcurrent, 1, 20), BD.cost)}
        ${row('Hand-off depth', 'How many times agents may pass work to each other (and spawn follow-ups).', stp('sHops', s.maxHops, 0, 20), BD.cost)}
        ${row('Claude CLI path', 'Blank = auto-detect.', txt('sClaude', s.claudePath, 'auto'))}</div>`],
      ['ctx', '📏', 'Context & Refresh', 'cost', `<div class="scard">
        ${row('Refresh threshold', 'Suggest a fresh session once an agent’s context passes this size. Shown as the tick on the Overview gauge.', rng('sRef', s.refreshTokens, 10000, 2000000, 10000, 'tokens'), BD.free)}
        ${row('Auto-refresh when idle', 'Summarises and restarts an idle agent that is over the threshold. Spends tokens on the hand-off summary.', tg('sAutoRef', s.autoRefresh), BD.cost)}</div>
        <div class="sub">Context windows (the gauge is measured against these)</div><div class="scard">
        ${row('Opus window', 'Model context size.', win('sWo', s.contextWindows?.opus || 200000))}
        ${row('Sonnet window', 'Model context size.', win('sWs', s.contextWindows?.sonnet || 200000))}
        ${row('Haiku window', 'Model context size.', win('sWh', s.contextWindows?.haiku || 200000))}</div>`],
      ['jud', '🧭', 'Routing & Judge', 'cost', `<div class="warnbox">⚠ The judge makes an extra model call on routed messages, so it uses plan usage. Changes here apply right away.</div><div class="scard">
        ${row('Enable the judge', 'Picks the best agent for a message. Off = no judge calls.', tg('sJudge', s.judge.enabled), BD.cost)}
        ${row('Judge model', 'A small model keeps it cheap.', sel('sJudgeModel', cfg.modelChoices.map((m) => opt(m, m, s.judge.model)).join('')))}</div>`],
      ['gua', '🛡', 'Usage Guard', '', `<div class="scard">
        ${row('Hold new work near plan limits', 'Queues new tasks instead of starting them close to a limit.', tg('sBud', b.enabled), BD.free)}
        ${row('5-hour limit', 'Hold when this much of the 5-hour window is used.', rng('sB5', Math.round(b.fiveHour * 100), 1, 100, 1, '%'))}
        ${row('Weekly limit', 'Hold when this much of the week is used.', rng('sBW', Math.round(b.weekly * 100), 1, 100, 1, '%'))}</div>`],
      ['crew', '👥', 'Crew members', '', `<div class="scard" id="sAgentList"></div><div class="srow2"><button class="btn" id="sAddAgent" type="button">+ Add agent</button></div>`, 'ns'],
      ['mach', '🖥', 'Machines', '', '<div id="setMach"></div>', 'ns'],
      ['int', '🔌', 'Integrations', '', '<div id="setInt"></div><div class="small" style="margin-top:8px">Cloudflare and machine pairing stay in crew.config.json. A backup is saved as crew.config.json.bak.</div>', 'ns'],
    ];
    const resettable = new Set(['mod', 'ctx', 'jud', 'gua']);
    $('#setBody').innerHTML = `<nav id="sNav">${SECS.map(([k, ic, t, fl], i) => `<a data-k="${k}" class="${i ? '' : 'on'}">${ic} <span>${t}</span>${fl.includes('cost') ? '<small class="c">$$</small>' : ''}${fl.includes('risk') ? '<small class="r">⚠</small>' : ''}</a>`).join('')}</nav>
      <div id="sMain"><div id="rsBanner" hidden><span>Port or network access changed. Restart Crew to apply.</span><button class="btn primary" id="rsNow" type="button">Restart now</button></div>
      ${SECS.map(([k, , t, , h, ns], i) => `<section class="ssec ${i ? '' : 'on'}" data-k="${k}" ${ns ? 'data-ns' : ''}><div class="ssh"><h4>${t}</h4>${resettable.has(k) ? '<button class="btn" data-reset type="button">Reset to defaults</button>' : ''}</div>${h}</section>`).join('')}
      <div class="snone" hidden>No settings match.</div></div>`;
    const unit = (el) => { const v = +el.value, u = el.dataset.u; return u === 'tokens' ? (v >= 1e6 ? +(v / 1e6).toFixed(2) + 'M' : Math.round(v / 1000) + 'k') + ' tokens' : v + (u === '%' ? '%' : ''); };
    const lbl = (el) => { el.nextElementSibling.textContent = unit(el); };
    $('#setBody').querySelectorAll('input[type=range]').forEach(lbl);
    bindSourceAndUninstall();
    // ----- live save
    const $st = $('#setSaved');
    const state = (k, msg) => { $st.className = 'setsaved ' + k; $st.textContent = msg; if (k === 'ok') { clearTimeout(state.t); state.t = setTimeout(() => { if ($st.classList.contains('ok')) $st.textContent = ''; }, 1800); } };
    let saveT = 0, saving = false;
    const payload = () => {
      const num = (id) => +$(id).value;
      return { settings: {
        userName: $('#sUser').value, defaultAgent: $('#sDef').value, machineName: $('#sMach').value, port: num('#sPort'), allowLan: $('#sLan').checked,
        model: $('#sModel').value || null, permissionMode: $('#sPerm').value, maxConcurrent: num('#sConc'), maxHops: num('#sHops'), claudePath: $('#sClaude').value, refreshTokens: num('#sRef'), contextWindows: { opus: num('#sWo'), sonnet: num('#sWs'), haiku: num('#sWh') }, autoRefresh: $('#sAutoRef').checked,
        effort: $('#sEffort').value, judge: { enabled: $('#sJudge').checked, model: $('#sJudgeModel').value },
        budget: { enabled: $('#sBud').checked, fiveHour: num('#sB5') / 100, weekly: num('#sBW') / 100 },
      }, agents: agDraft };
    };
    async function doSave() {
      clearTimeout(saveT);
      while (saving) await new Promise((ok) => setTimeout(ok, 40));
      saving = true; state('busy', 'Saving…');
      let res = { ok: false, error: 'Offline' };
      try {
        const r = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Crew': '1' }, body: JSON.stringify(payload()) });
        const j = await r.json().catch(() => ({}));
        if (r.ok && j.ok !== false) {
          cfg = { ...cfg, ...(await (await fetch('/api/config')).json()) };
          res = { ok: true }; state('ok', '✓ Saved');
          $('#rsBanner').hidden = !(+$('#sPort').value !== setBase.port || $('#sLan').checked !== setBase.allowLan);
        } else { res = { ok: false, error: j.error || 'Could not save' }; state('err', res.error); }
      } catch { state('err', 'Offline'); }
      saving = false; return res;
    }
    const sched = (ms) => { clearTimeout(saveT); saveT = setTimeout(doSave, ms); };
    const body = $('#setBody');
    body.oninput = (e) => {
      const t = e.target;
      if (t.type === 'range') return lbl(t);
      if (t.dataset.win) return;
      if (t.closest('[data-live]') && t.matches('.stx[type=text], .stn, .stx[type=number]')) sched(800);
    };
    const winSel = (sel) => { const n = $('#' + sel.dataset.win); if (sel.value === 'custom') { n.hidden = false; n.focus(); } else { n.hidden = true; n.value = sel.value; } };
    const winSync = (n) => { const sel = body.querySelector('[data-win=' + n.id + ']'); const v = +n.value; sel.value = v === 200000 || v === 1000000 ? String(v) : 'custom'; n.hidden = sel.value !== 'custom'; };
    body.onchange = (e) => { const t = e.target; if (t.dataset.win) { winSel(t); if (t.value === 'custom') return; } if (t.closest('[data-live]')) sched(t.type === 'range' ? 250 : 300); };
    body.onclick = (e) => {
      const st = e.target.closest('[data-st]');
      if (st) { const i = st.parentElement.querySelector('input'); i.value = Math.min(+i.max, Math.max(+i.min, (+i.value || 0) + +st.dataset.st)); i.dispatchEvent(new Event('change', { bubbles: true })); return; }
      const nv = e.target.closest('#sNav a');
      if (nv) { $('#setQ').value = ''; filt(''); showSec(nv.dataset.k); return; }
      if (e.target.closest('[data-reset]')) {
        const sec = e.target.closest('.ssec');
        sec.querySelectorAll('[id]').forEach((el) => {
          if (!(el.id in SET_DEF)) return;
          if (el.type === 'checkbox') el.checked = SET_DEF[el.id]; else el.value = SET_DEF[el.id];
          if (el.type === 'range') lbl(el);
          if (el.dataset && /^sW[osh]$/.test(el.id)) winSync(el);
        });
        doSave();
      }
      if (e.target.closest('#rsNow')) { $('#setDlg').close(); restartCrew(); }
    };
    // ----- nav + search
    const showSec = (k) => { body.querySelectorAll('#sNav a').forEach((a) => a.classList.toggle('on', a.dataset.k === k)); body.querySelectorAll('.ssec').forEach((x) => { x.hidden = false; x.classList.toggle('on', x.dataset.k === k); }); $('#sMain').scrollTop = 0; };
    function filt(q) {
      q = q.trim().toLowerCase();
      body.classList.toggle('searching', !!q);
      let any = false;
      body.querySelectorAll('.ssec').forEach((sec) => {
        if (!q) { sec.hidden = false; sec.querySelectorAll('.srow').forEach((r) => { r.hidden = false; }); return; }
        let n = 0;
        sec.querySelectorAll('.srow').forEach((r) => { const m = (r.dataset.s || '').includes(q); r.hidden = !m; if (m) n++; });
        sec.hidden = sec.hasAttribute('data-ns') || !n; if (n) any = true;
      });
      body.querySelector('.snone').hidden = !q || any;
      if (!q) showSec(body.querySelector('#sNav a.on')?.dataset.k || 'gen');
    }
    $('#setQ').value = ''; $('#setQ').oninput = (e) => filt(e.target.value);

    const syncDefault = () => {
      const cur = $('#sDef').value;
      $('#sDef').innerHTML = agDraft.map((a) => opt(a.id, a.name || a.id, cur)).join('');
    };
    const agList = () => {
      $('#sAgentList').innerHTML = agDraft.map((a, i) => `<div class="srow"><div class="l"><b>${esc(a.emoji || '')} ${esc(a.name || a.id)}</b> <span class="small">@${esc(a.id)}</span><p>${esc(a.model || 'default model')} · ${esc(a.permissionMode || 'default permissions')} · ${esc(a.cwd || '')}</p></div><button class="btn" data-ed="${i}" type="button">Edit</button></div>`).join('');
    };
    agList();
    $('#sAgentList').onclick = (e) => { const bt = e.target.closest('[data-ed]'); if (bt) agEdit(+bt.dataset.ed); };
    $('#sAddAgent').onclick = () => agEdit(-1);
    function agEdit(i) {
      const isNew = i < 0, a = isNew ? { id: '', name: '', emoji: '', cwd: '', description: '', instructions: '', model: '', permissionMode: '' } : agDraft[i];
      $('#agEditTitle').textContent = isNew ? 'New agent' : `${a.emoji || ''} ${a.name || a.id}`;
      $('#agEditBody').innerHTML = `<div class="fgrid">
        <label>ID (used for @mentions)<input type="text" data-k="id" value="${esc(a.id)}" ${isNew ? '' : 'readonly'}></label>
        <label>Name<input type="text" data-k="name" value="${esc(a.name)}"></label>
        <label>Emoji<input type="text" data-k="emoji" value="${esc(a.emoji)}" maxlength="8"></label>
        <label>Model<select data-k="model">${opt('', 'Default', a.model)}${cfg.modelChoices.map((m) => opt(m, m, a.model)).join('')}</select></label>
        <label>Permission mode ${BD.risk}<select data-k="permissionMode">${opt('', 'Default', a.permissionMode)}${cfg.permissionModes.map((m) => opt(m, m, a.permissionMode)).join('')}</select></label>
        <label class="wide2">Folder<input type="text" data-k="cwd" value="${esc(a.cwd)}" placeholder="C:/Projects/my-app"></label>
        <label class="wide2">Description<input type="text" data-k="description" value="${esc(a.description)}"></label>
        <label class="wide2">Instructions<textarea data-k="instructions">${esc(a.instructions)}</textarea></label></div>
        <div class="row" style="margin-top:12px"><button class="btn" id="agRm" type="button" ${isNew ? 'hidden' : ''}>Remove agent</button><span class="small grow" id="agErr" style="color:var(--err)"></span><button class="btn primary" id="agOk" type="button">Done</button></div>`;
      const fail = (m) => { $('#agErr').textContent = m; };
      $('#agOk').onclick = async () => {
        const o = Object.fromEntries([...$('#agEditBody').querySelectorAll('[data-k]')].map((el) => [el.dataset.k, el.value]));
        o.id = String(o.id).trim().toLowerCase();
        const prev = agDraft.map((x) => ({ ...x }));
        if (isNew) agDraft.push(o); else agDraft[i] = { ...agDraft[i], ...o };
        const r = await doSave();
        if (!r.ok) { agDraft = prev; return fail(r.error); }
        syncDefault(); agList(); $('#agEditDlg').close();
      };
      $('#agRm').onclick = async () => {
        if (agDraft.length < 2) return fail('Keep at least one agent.');
        if (!confirm(`Remove ${a.name || a.id}?`)) return;
        const prev = agDraft.map((x) => ({ ...x })), prevDef = $('#sDef').value;
        agDraft.splice(i, 1); syncDefault();
        const r = await doSave();
        if (!r.ok) { agDraft = prev; syncDefault(); $('#sDef').value = prevDef; return fail(r.error); }
        agList(); $('#agEditDlg').close();
      };
      open('#agEditDlg');
    }
    renderMachines(); startMachTimer(); renderIntegrations(false);
  }
  $('#setBtn').onclick = async () => {
    const r = await fetch('/api/config');
    if (!r.ok) return alert('Settings can only be changed from the PC Crew runs on.');
    cfg = await r.json(); renderSettings(); open('#setDlg');
  };
  fetch('/api/config').then(async (r) => { if (r.ok) { cfg = await r.json(); $('#setBtn').hidden = false; } }).catch(() => {});

  checkUpdate();
  setInterval(checkUpdate, 30 * 60 * 1000);
})();
</script>
